version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    # The Pi harness is pinned to exact versions on purpose (see AGENTS.md);
    # upgrading it is a deliberate act, not a routine dependency bump.
    ignore:
      - dependency-name: "@earendil-works/*"
      - dependency-name: "pi-subagents"
      - dependency-name: "pi-web-access"
      - dependency-name: "skills"
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
