name: Checks

# Repository-hygiene gates that are cheap and must run even on
# documentation-only changes. `Tests` deliberately skips docs-only pushes to
# `main`; these checks are precisely the ones a docs-only change can break, so
# this workflow carries no `paths-ignore`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: docs:check
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      # The root package has no dependencies, so there is nothing to install:
      # `scripts/repo.mjs` and `scripts/docs-check.mjs` are plain Node.
      - name: Run documentation checks
        run: npm run docs:check

  # The ratchet's hooks are local, and `core.hooksPath` is only set when
  # `start.mjs` runs — so a contributor who has never launched the app can
  # shrink the worst file, leave the cap high, and push a green build. ESLint
  # enforces the cap's value but not its freshness: a stale-high cap passes
  # lint by definition. This is the server-side half.
  ratchet:
    name: max-lines ratchet
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      # Checkout populates the index, which is what `ratchet:check` measures.
      - uses: actions/checkout@v5
      - name: Check the max-lines ratchet is in sync
        run: node scripts/repo.mjs ratchet:check

  # `gh pr create --body` replaces the PR template wholesale, so the closing
  # checklist from `.github/pull_request_template.md` never reaches the PR
  # description. This job catches that: it reads the body from the event
  # payload and fails when the checklist is absent.
  pr-checklist:
    name: PR closing checklist
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # Bots do not use the PR template — dependabot writes its own body — so
    # gating them would red three PRs a week that nobody can fix, and would
    # block them outright once Checks joins the required set. Exactly the
    # broken-gate shape this job exists to prevent.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot' }}
    steps:
      # No checkout and no Node setup: this reads one environment variable and
      # nothing from the tree, and ubuntu-latest ships node. A gate that runs on
      # every PR should cost seconds.
      - name: Check PR closing checklist
        env:
          # Pass the body through an environment variable, never by shell
          # interpolation. A PR body is attacker-controllable text; inserting
          # it directly into a `run:` line is a script-injection vector.
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          node - <<'NODE'
          const body = process.env.PR_BODY || "";

          if (!body) {
            console.error("FAIL: PR body is empty.");
            console.error(
              "`gh pr create --body` discards the PR template. Copy the closing " +
              "checklist from .github/pull_request_template.md into the PR description."
            );
            process.exit(1);
          }

          const headingAt = body.indexOf("## PR closing checklist");
          const hasHeading = headingAt !== -1;

          // Everything from the heading to the next one, or to the end. The
          // checks below run on that slice rather than the whole body: a PR
          // that names the heading in one place and happens to carry a task
          // list somewhere else — a plan, a set of follow-ups — would
          // otherwise satisfy a gate whose whole question is whether the
          // checklist itself is present.
          // Blank fenced blocks before looking for the next heading. A `#`
          // line inside a fence is content, and cutting the section there
          // drops the checkboxes below it — the same mistake the changelog
          // check makes a point of not making.
          const deFence = (text) => {
            let open = null;
            return text
              .split("\n")
              .map((line) => {
                const fence = /^ {0,3}(`{3,}|~{3,})/.exec(line);
                if (!fence) return open === null ? line : "";
                const marker = fence[1][0];
                if (open === null) open = marker;
                else if (marker === open) open = null;
                return "";
              })
              .join("\n");
          };

          // Every occurrence, not just the first: a copy-pasted duplicate
          // heading would otherwise slice at the second one and never see the
          // checkboxes it contains.
          const HEADING = "## PR closing checklist";
          const sections = [];
          for (let at = body.indexOf(HEADING); at !== -1; at = body.indexOf(HEADING, at + 1)) {
            const after = body.slice(at + HEADING.length);
            const masked = deFence(after);
            const next = masked.search(/^#{1,6} /m);
            sections.push(next === -1 ? after : after.slice(0, next));
          }

          const satisfies = (section) => {
            // An actual checkbox line is the one signal that is hard to
            // produce by accident. Without it, a body that merely *discusses*
            // the checklist ("I skipped it because npm run verify -- docs
            // fails") satisfied the gate.
            const hasCheckbox = /^\s*- \[[ xX]\]/m.test(section);
            // The most distinctive items from the template. Pragmatic on
            // purpose: items get reworded, and a gate that breaks on a
            // rewording is one that gets deleted.
            const matchedPhrases = [
              "Handoff archived or removed from",
              "Plan moved to",
              "dev-docs/maintenance-log.md",
              "npm run verify -- docs",
            ].filter((phrase) => section.includes(phrase)).length;
            // Two, not one. A single prose mention plus an unrelated todo
            // ("- [ ] follow up later") satisfied the gate with no checklist
            // present. A real body copies the whole template, so the cost of
            // requiring two is nil.
            return hasCheckbox && matchedPhrases >= 2;
          };

          if (!hasHeading || !sections.some(satisfies)) {
            console.error("FAIL: PR body is missing the closing checklist.");
            console.error(
              "`gh pr create --body` discards the PR template. Copy the closing " +
              "checklist from .github/pull_request_template.md into the PR description."
            );
            process.exit(1);
          }

          console.log("PR closing checklist: present");
          NODE

  secrets:
    name: gitleaks
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Gitleaks scans history, not just the tree. Without full depth it
          # would only ever see the tip commit and miss a key that was
          # committed and then removed in a later commit on the same branch.
          fetch-depth: 0
      # Installed from the upstream release rather than `gitleaks-action`:
      # the Action requires a licence key for organisation accounts and would
      # have to be SHA-pinned, while the binary is verified here by checksum.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_CONFIG_SHA256: e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o gitleaks.tar.gz "$url"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
          # The lockfile pass extends the upstream rules from a copy of the
          # default config with its global `[allowlist] paths` array deleted —
          # that array is what makes lockfiles unreadable, and it cannot be
          # un-inherited via `useDefault = true`. Same version tag as the
          # binary, verified by its own checksum; bumping one without the other
          # must fail.
          curl -fsSL -o base.toml \
            "https://raw.githubusercontent.com/gitleaks/gitleaks/v${GITLEAKS_VERSION}/config/gitleaks.toml"
          echo "${GITLEAKS_CONFIG_SHA256}  base.toml" | sha256sum -c -
          python3 - <<'PY'
          s = open("base.toml").read()
          i = s.index("[allowlist]")
          j = s.index("paths = [", i)
          k = s.index("\n]\n", j) + 3
          open(".gitleaks-base.toml", "w").write(s[:j] + s[k:])
          PY
          rm base.toml
      # `--verbose` because without it a failure prints only "leaks found: N",
      # with no file, line or match to act on.
      - name: Scan for committed secrets
        run: ./gitleaks git --no-banner --no-color --verbose --redact --config .gitleaks.toml .
      # A second pass, over history, for the files the first one is not allowed
      # to read. `useDefault = true` silently inherits gitleaks' bundled path
      # allowlist, which skips both lockfiles, `node_modules` and `vendor`, and
      # there is no supported way to un-inherit it. Dependabot churns those
      # lockfiles weekly, so leaving them exempt from every rule at once is the
      # wrong blind spot for a BYOK app. See `.gitleaks-lockfiles.toml`.
      - name: Scan lockfiles and vendored files for secrets
        run: ./gitleaks git --no-banner --no-color --verbose --redact --config .gitleaks-lockfiles.toml .
      # A third pass, and the only one that is not about secrets at all: a
      # committed home directory is a portability and privacy problem. Its
      # rules need `useDefault = false` too, because gitleaks' bundled
      # defaults globally allowlist `/home/<name>/`. Not redacted — the point
      # of the finding is being able to read which path it is.
      #
      # It scans the tracked tree, not history, which is the one real
      # difference from the secret scan above. A key that reached any commit is
      # still a live credential and has to be found wherever it is; a host path
      # only matters where it currently sits. Scanning history here would mean
      # a path removed three commits ago fails the build forever. The tree is
      # exported with `git ls-files` rather than scanned in place, because
      # `gitleaks dir .` walks gitignored content too — locally that is the
      # 2 GB `projects/` directory, full of real host paths that are not ours.
      - name: Scan for committed host paths
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/tracked"
          mkdir -p "${RUNNER_TEMP}/tracked"
          git ls-files -z | tar --null -T - -cf - | tar -x -C "${RUNNER_TEMP}/tracked"
          ./gitleaks dir --no-banner --no-color --verbose --config .gitleaks-paths.toml "${RUNNER_TEMP}/tracked"
