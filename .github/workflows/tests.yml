name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "dev-docs/**"
      - "**/*.md"
      - "*.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (vitest, ${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Lint
        working-directory: server
        run: npm run lint
      # Coverage carries a threshold floor (see server/vitest.config.ts) and is
      # platform-independent, so it runs once rather than on every matrix leg.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        working-directory: server
        run: npm run test:coverage
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        working-directory: server
        run: npm test

  frontend:
    name: frontend (vitest, ${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build Next.js
        working-directory: web
        run: npm run build
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-failure-${{ matrix.os }}
          path: web/.next/
          retention-days: 7
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        working-directory: web
        run: npm run test:coverage
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        working-directory: web
        run: npm run test

  launcher-smoke:
    name: launcher --check (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run start.sh --check
        if: runner.os != 'Windows'
        run: ./start.sh --check
      - name: Run start.cmd --check
        if: runner.os == 'Windows'
        shell: cmd
        run: start.cmd --check
