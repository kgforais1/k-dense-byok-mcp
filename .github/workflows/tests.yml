name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "dev-docs/**"
      - "**/*.md"
      - "*.md"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend (vitest, ${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install dependencies
        working-directory: server
        run: npm ci
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.12.21'
          enable-cache: true
          cache-dependency-glob: server/src/helpers/uv.lock
      - name: Install scientific test dependencies
        # FORK: --no-build (githubactions:S8541); deps install from wheels, never source builds.
        run: uv sync --frozen --no-build --project server/src/helpers --python 3.12.14 --python-preference only-managed
      - name: Typecheck
        working-directory: server
        run: npm run typecheck
      - name: Lint
        working-directory: server
        run: npm run lint
      # Coverage carries a threshold floor (see server/vitest.config.ts) and is
      # platform-independent, so it runs once rather than on every matrix leg.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        working-directory: server
        run: npm run test:coverage
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        working-directory: server
        run: npm test

  frontend:
    name: frontend (vitest, ${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Build Next.js
        working-directory: web
        run: npm run build
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-build-failure-${{ matrix.os }}
          path: web/.next/
          retention-days: 7
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        working-directory: web
        run: npm run test:coverage
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        working-directory: web
        run: npm run test

  launcher-smoke:
    name: launcher --check (${{ matrix.os }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Run start.sh --check
        if: runner.os != 'Windows'
        run: ./start.sh --check
      - name: Run start.cmd --check
        if: runner.os == 'Windows'
        shell: cmd
        run: start.cmd --check
      # Offline launcher test with a fake brew/node in an isolated PATH:
      # no network, no installs, no services. POSIX-only (Homebrew path).
      - name: Test missing-Node Homebrew path
        if: runner.os != 'Windows'
        run: bash scripts/test-start-sh-missing-node.sh

  runtime-policy:
    name: runtime policy (node ${{ matrix.node }}, ${{ matrix.os }})
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.23.4
          - os: ubuntu-latest
            node: 24.22.1
          - os: ubuntu-latest
            node: 26.12.1
          # Windows coverage on at least one supported line; POSIX-only
          # signal tests skip there, everything else runs.
          - os: windows-latest
            node: 24.22.1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # The guard tests exercise the real wired tsx/next entries, so both
      # package trees must be installed (pinned minimums included).
      - name: Install server dependencies
        working-directory: server
        run: npm ci
      - name: Install web dependencies
        working-directory: web
        run: npm ci
      - name: Run runtime policy tests
        # On these pinned minimums the host passes the policy, so accept
        # paths execute for real with process.execPath (no skips other than
        # POSIX-only signal tests on Windows).
        run: node --test node-policy.test.mjs node-guard.test.mjs
