# SonarQube Cloud automatic-analysis settings (fork-owned; upstream has no
# such file, so this never conflicts on a sync).
#
# Exclude test code from duplication detection only. Tests repeat fixture
# setup and assertion shapes on purpose, and every upstream sync brings new
# test files that would otherwise trip the "duplication on new code" gate
# (PR #61: 12 of 21 flagged lines were in server/test). Tests are still
# analysed for bugs, vulnerabilities and code smells.
sonar.cpd.exclusions=server/test/**,web/src/test/**,**/*.test.ts,**/*.test.tsx,**/*.test.mjs
